replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/piotrwozn/multidb
  tag: 1.0.0-rc.1
  # Required in production: use a real verified image digest.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  pgwirePort: 5432
  adminPort: 8080

runtime:
  mode: production
  dbPath: /var/lib/multidb/multidb.redb
  studioDir: /usr/share/multidb/studio
  adminBind: 0.0.0.0:8080
  pgBind: 0.0.0.0:5432
  pgUser: multidb
  terminationGracePeriodSeconds: 60
  preStopDelaySeconds: 5
  # InMemory only: all database state is lost on process/pod restart.
  allowVolatile: false

runtimeClassName: ""
supplementalGroups: []

gpu:
  enabled: false
  vendor: ""
  # Optional exact resource advertised by the installed device plugin (e.g.xe).
  resourceName: ""

encryption:
  enabled: false
  secretName: multidb-encryption
  key: key
  mountPath: /etc/multidb/encryption

audit:
  enabled: true
  secretName: multidb-audit
  key: audit-key
  mountPath: /etc/multidb/audit-key
  anchorPath: /var/lib/multidb/audit.anchor

secrets:
  adminPassword:
    name: multidb-admin
    key: admin-password
  adminToken:
    name: multidb-admin
    key: admin-token
  pgPassword:
    name: multidb-pg
    key: password
  pgTls:
    name: multidb-pg-tls
    certKey: tls.crt
    privateKey: tls.key
    mountPath: /etc/multidb/pg-tls

persistence:
  enabled: true
  # local-dev or explicitly acknowledged InMemory only.
  devEmptyDir: false
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  retainOnDelete: true

config:
  # Flat serve is SINGLE NODE. The legacy replication hint never creates HA.
  # Spec mode decides profile/replication and rejects unsupported live CP/AP.
  profile: transactional
  replication: ""
  auditJsonlPath: /var/lib/multidb/audit/audit.jsonl
  backupTarget: s3://multidb-local/backups
  minioEndpoint: http://minio:9000
  vaultAddress: http://vault:8200
  vaultKekPath: secret/data/multidb/kek
  # Transactional profile can reserve512MiB/query; leave native/index headroom.
  maxConcurrentQueries: 2
  queryQueueTimeoutMs: 5000
  historyRetainLsns: ""

# Spec mode (preview, docs/provisioning.md#serve): serve builds the database from a
# DatabaseSpec mounted read-only from a ConfigMap and checks it against the spec at every
# start. runtime.dbPath is still set explicitly, so it wins over the spec storage_path.
spec:
  enabled: false
  # ConfigMap that holds the spec under spec.key.
  configMap: multidb-spec
  key: multidb.yaml
  mountPath: /etc/multidb/spec
  # MULTIDB_SPEC_APPLY: verify (never changes the database; refuses to start when it is
  # missing or differs), create (also creates a missing database) or additive (also applies
  # auto-approvable additive changes).
  apply: verify

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

probes:
  readinessPath: /ready
  livenessPath: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  startupPeriodSeconds: 5
  startupFailureThreshold: 60
  readinessFailureThreshold: 3
  livenessFailureThreshold: 6

# Protect accidental drains; approved maintenance must acknowledge downtime.
pdb:
  enabled: true

networkPolicy:
  enabled: true
  # Standard NetworkPolicyPeer objects; empty means deny application clients.
  clientPeers: []
  proxyPeers: []
  metricsPeers: []
  # Standard egress rules; DNS/cloud access must be explicitly declared.
  egress: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
  principalHeaderTrustAcknowledged: false

monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
imagePullSecrets: []
