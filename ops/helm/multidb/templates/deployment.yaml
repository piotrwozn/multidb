{{- include "multidb.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multidb.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "multidb.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "multidb.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "multidb.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        multidb.io/upgrade-policy: stop-single-writer-before-replacement
        multidb.io/downgrade-policy: reject-unless-explicit-rollback
        {{- if .Values.runtime.allowVolatile }}
        multidb.io/storage-durability: volatile-data-lost-on-restart
        {{- else if .Values.persistence.devEmptyDir }}
        multidb.io/storage-durability: ephemeral-emptydir-data-lost-on-pod-replacement
        {{- else }}
        multidb.io/storage-durability: persistent-volume
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "multidb.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.runtime.terminationGracePeriodSeconds }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        {{- with .Values.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-runtime
          image: {{ include "multidb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec", "umask 077; mkdir -p /runtime/private; chmod 0700 /runtime/private"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
      containers:
        - name: multidb
          image: {{ include "multidb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "multidb.fullname" . }}-config
          env:
            - name: MULTIDB_ADMIN_PASSWORD_FILE
              value: /etc/multidb/auth/admin-password
            {{- if .Values.secrets.adminToken.name }}
            - name: MULTIDB_ADMIN_TOKEN_FILE
              value: /etc/multidb/auth/admin-token
            {{- end }}
            - name: MULTIDB_PG_PASSWORD_FILE
              value: /etc/multidb/auth/pg-password
            {{- if .Values.audit.enabled }}
            - name: MULTIDB_AUDIT_KEY_PATH
              value: {{ printf "%s/key.bin" .Values.audit.mountPath | quote }}
            {{- if not .Values.runtime.allowVolatile }}
            - name: MULTIDB_AUDIT_ANCHOR_PATH
              value: {{ .Values.audit.anchorPath | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.encryption.enabled }}
            - name: MULTIDB_ENCRYPTION_KEY_PATH
              value: {{ printf "%s/key.bin" .Values.encryption.mountPath | quote }}
            {{- end }}
            {{- if and .Values.gpu.enabled (eq .Values.gpu.vendor "nvidia") }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,graphics
            {{- end }}
            {{- if eq .Values.runtime.mode "production" }}
            - name: MULTIDB_PG_TLS_CERT
              value: {{ printf "%s/tls.crt" .Values.secrets.pgTls.mountPath | quote }}
            - name: MULTIDB_PG_TLS_KEY
              value: {{ printf "%s/tls.key" .Values.secrets.pgTls.mountPath | quote }}
            {{- else }}
            - name: MULTIDB_PG_TLS_MODE
              value: disabled
            {{- end }}
            - name: XDG_RUNTIME_DIR
              value: /tmp/multidb-runtime/private
          ports:
            - name: pgwire
              containerPort: {{ .Values.service.pgwirePort }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: admin
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: admin
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.readinessFailureThreshold }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: admin
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.livenessFailureThreshold }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", {{ printf "sleep %v" .Values.runtime.preStopDelaySeconds | quote }}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/multidb
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /tmp/multidb-runtime
            - name: auth
              mountPath: /etc/multidb/auth
              readOnly: true
            {{- if .Values.audit.enabled }}
            - name: audit-key
              mountPath: {{ .Values.audit.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.encryption.enabled }}
            - name: encryption
              mountPath: {{ .Values.encryption.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.runtime.mode "production" }}
            - name: pg-tls
              mountPath: {{ .Values.secrets.pgTls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.spec.enabled }}
            - name: spec
              mountPath: {{ .Values.spec.mountPath | quote }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.devEmptyDir }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "multidb.fullname" .)) .Values.persistence.existingClaim | quote }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: auth
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: {{ .Values.secrets.adminPassword.name | quote }}
                  items:
                    - key: {{ .Values.secrets.adminPassword.key | quote }}
                      path: admin-password
              {{- if .Values.secrets.adminToken.name }}
              - secret:
                  name: {{ .Values.secrets.adminToken.name | quote }}
                  items:
                    - key: {{ .Values.secrets.adminToken.key | quote }}
                      path: admin-token
              {{- end }}
              - secret:
                  name: {{ .Values.secrets.pgPassword.name | quote }}
                  items:
                    - key: {{ .Values.secrets.pgPassword.key | quote }}
                      path: pg-password
        {{- if .Values.encryption.enabled }}
        - name: encryption
          secret:
            secretName: {{ .Values.encryption.secretName | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.encryption.key | quote }}
                path: key.bin
        {{- end }}
        {{- if .Values.audit.enabled }}
        - name: audit-key
          secret:
            secretName: {{ .Values.audit.secretName | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.audit.key | quote }}
                path: key.bin
        {{- end }}
        {{- if eq .Values.runtime.mode "production" }}
        - name: pg-tls
          secret:
            secretName: {{ .Values.secrets.pgTls.name | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.secrets.pgTls.certKey | quote }}
                path: tls.crt
              - key: {{ .Values.secrets.pgTls.privateKey | quote }}
                path: tls.key
        {{- end }}
        {{- if .Values.spec.enabled }}
        - name: spec
          configMap:
            name: {{ .Values.spec.configMap | quote }}
            defaultMode: 288
            items:
              - key: {{ .Values.spec.key | quote }}
                path: {{ .Values.spec.key | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
